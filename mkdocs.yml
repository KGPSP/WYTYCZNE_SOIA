site_name: Wytyczne SOiA
site_description: Wytyczne organizacyjne, techniczne i sprzętowe dotyczące SOiA
site_author: Biuro Informatyki i Łączności Komendy Głównej Państwowej Straży Pożarnej
site_url: https://kgpsp.github.io/WYTYCZNE_SOIA/
repo_url: https://github.com/KGPSP/WYTYCZNE_SOIA
repo_name: KGPSP/WYTYCZNE_SOIA
edit_uri: ""
copyright: "Podręcznik SOiA — wersja 0.4"

theme:
  name: material
  language: pl
  logo: assets/images/logo-psp.svg
  favicon: assets/images/logo-psp.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Włącz ciemny motyw
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Włącz jasny motyw
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search:
      lang: pl

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
      toc_depth: "2-3"

extra_css:
  - assets/stylesheets/extra-v2.css

nav:
  - "Podręcznik SOiA": index.md
  - "Część I. Cel, zasady i zakres systemu":
      - "Załącznik nr 2 — Informacja dla organów": zalaczniki/Z2-INFORMACJA-DLA-ORGANOW.md
  - "Część II. Terminologia i interpretacja":
      - "Załącznik nr 1 — Słownik pojęć": zalaczniki/Z1-SLOWNIK.md
  - "Część III. Wymagania dla urządzeń":
      - "Załącznik nr 3 — Wymagania minimalne": zalaczniki/Z3-WYMAGANIA-MINIMALNE.md
      - "Załącznik nr 4 — Katalog sygnałów": zalaczniki/Z4-KATALOG-SYGNALOW.md
      - "Załącznik nr 5 — Profile sterownika": zalaczniki/Z5-PROFILE-STEROWNIKA.md
  - "Część IV. Podłączenie i integracja":
      - "Załącznik nr 6 — Poziom 0": zalaczniki/Z6-POZIOM-0-PUBLICZNY-WYKAZ.md
      - "Załącznik nr 7 — Poziom 1": zalaczniki/Z7-POZIOM-1-REJESTRACJA.md
      - "Załącznik nr 8 — Poziom 2": zalaczniki/Z8-POZIOM-2-APN-I-SMS.md
  - "Część V. Konfiguracja i odbiór":
      - "Załącznik nr 9 — Karta konfiguracji": zalaczniki/Z9-KARTA-KONFIGURACJI.md
      - "Załącznik nr 10 — Testy i odbiór": zalaczniki/Z10-TESTY-I-ODBIOR.md
  - "Część VI. Zamówienie":
      - "Załącznik nr 11 — Wytyczne do OPZ": zalaczniki/Z11-ZAPISY-DO-OPZ.md
  - "Część VII. Ramy prawne":
      - "Załącznik nr 12 — Podstawa prawna": zalaczniki/Z12-PODSTAWA-PRAWNA.md
